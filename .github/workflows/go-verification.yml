name: Go verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format Go sources
        run: |
          gofmt -w api/*.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/*.go
          git diff --cached --quiet || (git commit -m "style: format Go source files" && git push)
      - name: Vet
        run: go vet ./api/...
      - name: Test
        run: go test ./...
